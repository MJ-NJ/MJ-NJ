<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150">
  <style>
    text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
    .p{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .p2{animation-delay:.6s}.p3{animation-delay:1.2s}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.6)}}
  </style>
  <rect width="900" height="150" rx="12" fill="#0d1117" stroke="#30363d"/>
  <text x="24" y="30" font-size="12" fill="#8b949e">STATUS · what's on my plate right now</text>
  <g>
    <circle class="p" cx="34" cy="68" r="4" fill="#7ee787"/>
    <text x="48" y="72" font-size="12" font-weight="700" letter-spacing="1" fill="#7ee787">BUILDING</text>
    <text x="24" y="98" font-size="16" font-weight="600" fill="#e6edf3">Iksha</text>
    <text x="24" y="120" font-size="12" fill="#8b949e">vision-AI nutrition label reader</text>
  </g>
  <line x1="300" y1="56" x2="300" y2="128" stroke="#30363d"/>
  <g>
    <circle class="p p2" cx="334" cy="68" r="4" fill="#58a6ff"/>
    <text x="348" y="72" font-size="12" font-weight="700" letter-spacing="1" fill="#58a6ff">SHIPPING @ THB</text>
    <text x="324" y="98" font-size="16" font-weight="600" fill="#e6edf3">Reliable multi-tenant backends</text>
    <text x="324" y="120" font-size="12" fill="#8b949e">outbox · CDC · tracing · ABAC/RBAC</text>
  </g>
  <line x1="610" y1="56" x2="610" y2="128" stroke="#30363d"/>
  <g>
    <circle class="p p3" cx="644" cy="68" r="4" fill="#ffa657"/>
    <text x="658" y="72" font-size="12" font-weight="700" letter-spacing="1" fill="#ffa657">EXPLORING</text>
    <text x="634" y="98" font-size="16" font-weight="600" fill="#e6edf3">Low-latency systems</text>
    <text x="634" y="120" font-size="12" fill="#8b949e">event-driven throughput · observability</text>
  </g>
</svg>
