<svg xmlns="http://www.w3.org/2000/svg" width="900" height="170" viewBox="0 0 900 170">
  <style>
    .sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
    .bar{transform-origin:left;transform:scaleX(0);animation:grow 1.6s cubic-bezier(.2,.8,.2,1) forwards}
    .b2{animation-delay:.2s}.b3{animation-delay:.4s}.b4{animation-delay:.6s}
    @keyframes grow{to{transform:scaleX(1)}}
  </style>
  <defs>
    <linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#bc8cff"/></linearGradient>
  </defs>
  <g class="sans">
    <!-- tile 1 -->
    <rect x="0" y="0" width="216" height="170" rx="12" fill="#0d1117" stroke="#30363d"/>
    <text x="108" y="62" font-size="40" font-weight="800" fill="#58a6ff" text-anchor="middle">97%</text>
    <text x="108" y="88" font-size="13" fill="#e6edf3" text-anchor="middle">faster crash recovery</text>
    <text x="108" y="108" font-size="11" fill="#8b949e" text-anchor="middle">30 min → 90 sec</text>
    <rect x="24" y="130" width="168" height="6" rx="3" fill="#21262d"/>
    <rect class="bar" x="24" y="130" width="163" height="6" rx="3" fill="url(#g1)"/>
    <!-- tile 2 -->
    <rect x="228" y="0" width="216" height="170" rx="12" fill="#0d1117" stroke="#30363d"/>
    <text x="336" y="62" font-size="40" font-weight="800" fill="#7ee787" text-anchor="middle">85%</text>
    <text x="336" y="88" font-size="13" fill="#e6edf3" text-anchor="middle">lower workflow MTTR</text>
    <text x="336" y="108" font-size="11" fill="#8b949e" text-anchor="middle">5 manual steps → 1 API call</text>
    <rect x="252" y="130" width="168" height="6" rx="3" fill="#21262d"/>
    <rect class="bar b2" x="252" y="130" width="143" height="6" rx="3" fill="#7ee787"/>
    <!-- tile 3 -->
    <rect x="456" y="0" width="216" height="170" rx="12" fill="#0d1117" stroke="#30363d"/>
    <text x="564" y="62" font-size="40" font-weight="800" fill="#ffa657" text-anchor="middle">&lt;1 min</text>
    <text x="564" y="88" font-size="13" fill="#e6edf3" text-anchor="middle">storage migration</text>
    <text x="564" y="108" font-size="11" fill="#8b949e" text-anchor="middle">was a 4-hour deploy cycle</text>
    <rect x="480" y="130" width="168" height="6" rx="3" fill="#21262d"/>
    <rect class="bar b3" x="480" y="130" width="166" height="6" rx="3" fill="#ffa657"/>
    <!-- tile 4 -->
    <rect x="684" y="0" width="216" height="170" rx="12" fill="#0d1117" stroke="#30363d"/>
    <text x="792" y="62" font-size="40" font-weight="800" fill="#ff7b72" text-anchor="middle">0</text>
    <text x="792" y="88" font-size="13" fill="#e6edf3" text-anchor="middle">data loss in DB outages</text>
    <text x="792" y="108" font-size="11" fill="#8b949e" text-anchor="middle">at-least-once + idempotent</text>
    <rect x="708" y="130" width="168" height="6" rx="3" fill="#21262d"/>
    <rect class="bar b4" x="708" y="130" width="168" height="6" rx="3" fill="#ff7b72"/>
  </g>
</svg>
